<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuye Lab 官网设计稿总览</title>
<link rel="stylesheet" href="assets/fonts/inter.css">
<link rel="stylesheet" href="assets/fonts/cjk.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#E9E6E0;color:#1E1B17;font:15px/1.5 'Inter Variable','Shuye Sans SC',sans-serif;padding:40px 40px 56px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px}
  h1{font-size:30px;margin:0;letter-spacing:-.01em}
  header p{margin:4px 0 0;color:#5A534A}
  .tabs{display:flex;gap:6px;background:#fff;border-radius:999px;padding:4px}
  .tabs a{padding:7px 16px;border-radius:999px;text-decoration:none;color:#5A534A;font-weight:600;font-size:14px}
  .tabs a.on{background:#1E1B17;color:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .card{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .card h2{font-size:17px;margin:0;display:flex;align-items:baseline;gap:8px}
  .card h2 b{font-size:13px;background:#1E1B17;color:#fff;border-radius:6px;padding:1px 7px}
  .card h2 .rec{font-size:11.5px;font-weight:700;color:#A8301F;background:#F6DDD5;border-radius:999px;padding:2px 8px}
  .card p{margin:0;color:#5A534A;font-size:14px}
  .shots{display:grid;grid-template-columns:1fr 34%;gap:8px;align-items:start}
  .shots a{display:block;border-radius:8px;overflow:hidden;border:1px solid #E2DED6;background:#f5f5f5}
  .shots img{display:block;width:100%;height:auto}
  .d{aspect-ratio:1440/1900}.m{aspect-ratio:390/1180}
  .d img,.m img{height:100%;object-fit:cover;object-position:top}
  .links{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px}
  .links a{color:#1E1B17}
</style>
</head>
<body>
<header>
  <div><h1>Shuye Lab 官网设计稿 · 6 套总览</h1><p>每套：左为桌面 1440 宽缩略（截取前段），右为手机 390 宽缩略。点缩略图看整页截图，点下方链接打开可交互页面。</p></div>
  <nav class="tabs" id="tabs"><a href="?page=home">首页</a><a href="?page=kaihua">Kaihua App 页</a><a href="?page=book">书页</a><a href="?page=zh">中文首页</a></nav>
</header>
<main class="grid" id="grid"></main>
<script>
const V = [
  ['v1','现代极简科技','大留白、超大无衬线标题、柔和渐变光斑、圆角卡片（Apple / Linear 式）。'],
  ['v2','温暖人文编辑','米白纸色、衬线标题、墨绿点缀，像一家好出版社的官网。'],
  ['v3','现代骨架 + 东方温度','纸色与朱砂印章、衬线标题配楷体汉字，现代网格承载新中式质感。'],
  ['v4','深色高级','深墨底、暖金高光、截图发光、玻璃质感卡片。'],
  ['v5','明快活泼 Bento','饱和色块、Bento 网格、贴纸式标签，活泼但不幼稚。'],
  ['v6','杂志 / 画廊','不对称网格、超大字号、大图出血、编号与图注。'],
];
const PATH = {home:'index.html', kaihua:'apps/kaihua/index.html', book:'books/citizenship-bridge/civics-2025-zh/index.html', zh:'zh/index.html'};
const qs = new URLSearchParams(location.search);
const page = qs.get('page') || 'home';
const blind = qs.has('blind');
document.querySelectorAll('#tabs a').forEach(a => { if (a.getAttribute('href') === '?page=' + page) a.classList.add('on'); });
document.getElementById('grid').innerHTML = V.map(([v, name, desc]) => `
  <section class="card">
    <h2><b>${v}</b>${name}${v === 'v3' && !blind ? '<span class="rec">主线程推荐方向</span>' : ''}</h2>
    <p>${desc}</p>
    <div class="shots">
      <a class="d" href="shots/${v}-${page}-desktop.png"><img src="shots/${v}-${page}-desktop.png" alt="${v} ${page} desktop"></a>
      <a class="m" href="shots/${v}-${page}-mobile.png"><img src="shots/${v}-${page}-mobile.png" alt="${v} ${page} mobile"></a>
    </div>
    <div class="links"><a href="${v}/index.html">首页</a><a href="${v}/${PATH.kaihua}">App 页</a><a href="${v}/${PATH.book}">书页</a><a href="${v}/zh/index.html">中文</a></div>
  </section>`).join('');
</script>
</body>
</html>
